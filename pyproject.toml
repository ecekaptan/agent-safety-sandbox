[project]
name = "agent-safety-sandbox"
version = "0.1.0"
description = "A test environment for measuring how safely an AI agent behaves when it has real tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Model provider SDK. Swap or add another (e.g. openai) to evaluate other models.
    "anthropic>=1.11.0",
    "inspect-ai>=0.3.276",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
